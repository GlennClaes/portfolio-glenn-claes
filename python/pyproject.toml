[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-tools"
version = "1.0.0"
description = "CLI tools and automation workflows for the Glenn Claes portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Glenn Claes" }]

dependencies = [
  "httpx>=0.28.1",
  "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=9.1.1",
]

[project.scripts]
portfolio-tools = "portfolio_tools.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
