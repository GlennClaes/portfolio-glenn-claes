      - any-glob-to-any-file:
          - 'frontend/**'

python:
  - changed-files:
      - any-glob-to-any-file:
          - 'python/**'

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'

docker:
  - changed-files:
