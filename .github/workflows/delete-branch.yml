name: Delete merged branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    name: Delete head branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event.pull_request.merged == true
    steps:
      - name: Delete branch
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" || echo "Branch already deleted or does not exist."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
