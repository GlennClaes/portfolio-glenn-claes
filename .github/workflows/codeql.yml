name: CodeQL Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# Only analyze the project's own code. Everything under .github/ is either a
# vendored third-party tool (.github/skills/impeccable) or GH templates/hooks —
# none of it is app code, so skip it to keep alerts relevant.
paths-ignore:
  - '**/.github/**'

jobs:
  analyze:
    name: Analyze code for security issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
