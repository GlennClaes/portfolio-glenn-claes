## Code of Conduct

### Our Standards
- Be respectful and inclusive
- Welcome newcomers and help them get started
- Accept constructive criticism gracefully
- Focus on what is best for the project

### Unacceptable Behavior
- Harassment or discrimination
- Trolling or insulting comments
- Publishing others' private information
- Any conduct that would be inappropriate in a professional setting

## Getting Started

### Prerequisites
- Node.js ≥ 20.19.0
- npm ≥ 10.0.0
- Git
- A code editor (VS Code recommended)

### Fork and Clone
```bash
# Fork the repository on GitHub
# Then clone your fork
git clone https://github.com/YOUR_USERNAME/portfolio-glenn-claes.git
cd portfolio-glenn-claes
```

## Development Setup

```bash
# Navigate to frontend directory
cd frontend

# Install dependencies
npm install

# Start development server
npm run dev

# Run quality checks
npm run lint
npm run typecheck
npm run test
```

### Recommended VS Code Extensions
- ESLint
- Prettier
- TypeScript + JavaScript
- Tailwind CSS IntelliSense
- Vitest

## Making Changes

### Create a Branch
```bash
# Create a feature branch
git checkout -b feature/your-feature-name

# Or a bugfix branch
git checkout -b fix/issue-number-description
```

### Make Your Changes
1. Write clean, readable code
2. Follow existing code style
3. Add comments for complex logic
4. Update documentation if needed

### Test Your Changes
```bash
# Run all quality checks
npm run lint           # ESLint
npm run typecheck      # TypeScript
npm run test           # Vitest unit tests
npm run test:e2e       # Playwright E2E tests
npm run build          # Production build
```

## Commit Guidelines

### Commit Message Format
Follow [Conventional Commits](https://www.conventionalcommits.org/):

```
<type>(<scope>): <subject>

<body>

<footer>
```

### Types
- `feat`: New feature
- `fix`: Bug fix
- `docs`: Documentation only
- `style`: Code style (formatting, semicolons)
- `refactor`: Code refactoring
- `perf`: Performance improvement
- `test`: Adding/updating tests
- `chore`: Build process, dependencies

### Examples
```bash
feat(hero): add mouse interaction to 3D scene
fix(contact): correct form validation for email
docs(architecture): update Three.js section
style(nav): improve hover transition
refactor(useReveal): simplify IntersectionObserver logic
```

### Before Committing
```bash
# Check formatting
npm run format:check

# Fix formatting issues
npm run format

# Check for linting errors
npm run lint
```

## Pull Request Process

### 1. Update Your Branch
```bash
git fetch upstream
git rebase upstream/main
```

### 2. Push Changes
```bash
git push origin feature/your-feature-name
```

### 3. Open a Pull Request
- Go to GitHub and open a Pull Request
- Fill in the PR template completely
- Link related issues
- Request review from maintainers

### 4. PR Requirements
- [ ] All tests pass
- [ ] Code is formatted
- [ ] No linting errors
- [ ] No TypeScript errors
- [ ] Documentation updated (if needed)
- [ ] Screenshots for UI changes

### 5. Review Process
- Maintainers will review your PR
- Address any feedback
- Once approved, a maintainer will merge

## Style Guidelines

### TypeScript
- Use strict mode
- Prefer interfaces for object types
- Use type aliases for unions/intersections
- Avoid `any` - use `unknown` when type is truly unknown

### React
- Functional components only
- Use hooks for state and effects
- Keep components small and focused
- Extract reusable logic into custom hooks

### CSS
- Use Tailwind utilities for common styles
- Use CSS custom properties for design tokens
- Follow BEM-like naming for custom classes
- Mobile-first responsive design

### File Naming
- Components: `PascalCase.tsx`
- Hooks: `camelCase.ts` with `use` prefix
- Utilities: `camelCase.ts`
- Tests: `*.test.tsx` co-located with source

### Code Organization
```
frontend/src/
├── app/           # Next.js pages and layouts
├── components/    # React components
├── hooks/         # Custom hooks
├── lib/           # Utility functions
├── data/          # Static data
└── i18n/          # Internationalization
```

