# Local container workflows for the Glenn Claes portfolio.
#
#   docker compose up --build web                          # production Next.js on :3000
#   docker compose --profile static up --build static      # Pages preview on :8080
#   docker compose --profile tools run python changelog v1.0.0 HEAD   # Python tools
services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: glenn-claes-portfolio:latest
    container_name: glenn-claes-portfolio
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

  static:
    profiles: ["static"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build:pages && npm run start:static"
    volumes:
      - ./frontend:/app
      - static_node_modules:/app/node_modules
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: http://localhost:8080

  python:
    profiles: ["tools"]
    build:
      context: ./python
      dockerfile: Dockerfile
    image: portfolio-tools:latest
    container_name: portfolio-tools
    volumes:
      - ./frontend/src/data:/data:ro

volumes:
  static_node_modules:
