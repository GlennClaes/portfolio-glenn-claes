# Local container workflows for the Glenn Claes portfolio.
#
#   docker compose up --build web      # run the production Next.js server on :3000
#   docker compose --profile static up --build static   # preview the GitHub Pages export on :8080
services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: glenn-claes-portfolio:latest
    container_name: glenn-claes-portfolio
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

  static:
    profiles: ["static"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build:pages && npm run start:static"
    volumes:
      - ./frontend:/app
      - static_node_modules:/app/node_modules
    ports:
      - "8080:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: http://localhost:8080

volumes:
  static_node_modules:
